# =========================================================
#  Va en:  backend/src/main/resources/application-prod.properties
#
#  Es un PERFIL: sólo se aplica cuando la variable de entorno
#  SPRING_PROFILES_ACTIVE vale "prod". En local no se toca nada,
#  así que tu application.properties de siempre sigue mandando
#  cuando desarrollas.
#
#  La sintaxis ${VARIABLE} lee variables de entorno. Así ninguna
#  contraseña vive en el código: las pones en el panel de Render.
# =========================================================

# Render asigna un puerto aleatorio y lo pasa en $PORT.
# Si la app no escucha ahí, Render la da por muerta.
server.port=${PORT:8080}

# Conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate = Hibernate comprueba que las tablas encajan con tus
# entidades, pero NO las modifica. Es lo correcto en producción:
# el esquema lo has creado tú y nadie lo toca por sorpresa.
# Si al arrancar falla por diferencias de esquema, cambia
# temporalmente a "update" para salir del paso.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Sin SQL en los logs: en producción sólo ensucia
spring.jpa.show-sql=false

# Orígenes permitidos por CORS, separados por comas.
# Se define en Render con la URL real del frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
