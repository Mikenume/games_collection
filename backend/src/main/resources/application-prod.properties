# Perfil de producción, activo solo si SPRING_PROFILES_ACTIVE=prod

# Render asigna el puerto en $PORT
server.port=${PORT:8080}

# Conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# No tocar el esquema en producción
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Sin SQL en los logs
spring.jpa.show-sql=false

# Orígenes permitidos por CORS, definidos en Render
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# La sesión caduca a los 30 minutos sin actividad (cada petición la renueva)
server.servlet.session.timeout=15m

# El frontend y la API están en dominios distintos de Render, así que la
# cookie de sesión necesita SameSite=None (y por tanto Secure) para que
# el navegador la mande en las peticiones entre uno y otro
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true