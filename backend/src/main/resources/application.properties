spring.application.name=games_collection

spring.datasource.url=jdbc:postgresql://localhost:5432/central_videogames
spring.datasource.username=postgres
spring.datasource.password=wingardium

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,beans,mappings,env

# Las relaciones perezosas solo se pueden cargar dentro de la transacción.
# Con esto en false, si se te escapa una entity al controller falla pronto
# y de forma clara, en vez de disparar consultas silenciosas.
spring.jpa.open-in-view=false

