spring.application.name=games_collection

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/central_videogames}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,beans,mappings,env

# La sesión caduca a los 30 minutos sin actividad (cada petición la renueva)
server.servlet.session.timeout=15m

# Configuración del cliente para acceder automáticamente a las imágenes de carátulas de los juegos en IGDB.
# Vacías por defecto para que la app arranque sin ellas; la búsqueda devuelve entonces un 502.
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
