# Opcional: si prefieres configurar Render desde el repo en vez de
# desde el panel, sube este fichero en la raíz del proyecto frontend.
services:
  - type: web
    name: central-videogames-front
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: ""            # vacía: el frontend llama a /api en su mismo dominio
    routes:
      # Primero la API: Render la reenvía al backend y así la cookie de sesión
      # es del mismo dominio que la web (no de terceros)
      - type: rewrite
        source: /api/*
        destination: https://central-videogames-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
